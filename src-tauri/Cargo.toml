[package]
name = "unheard"
version = "0.1.0"
description = "UNHEARD — finding the needs no one reported"
authors = ["UNHEARD team"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "unheard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
